name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    name: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run all 13 test suites (502 tests)
        run: |
          python3 --version
          set -e
          for suite in test_lexer test_parser test_checker test_interpreter \
                       test_programs test_stdlib test_repl test_mega \
                       test_step6 test_step7 test_step8 test_step9 test_ultimate; do
            echo "===== $suite ====="
            python3 "$suite.py"
          done
